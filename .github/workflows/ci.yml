name: CI

on:
  push:
    branches: [main]
    # Snapshot commits from the scheduled check do not touch code, so they need no re-test.
    paths-ignore:
      - "snapshots/**"
      - "reports/**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
